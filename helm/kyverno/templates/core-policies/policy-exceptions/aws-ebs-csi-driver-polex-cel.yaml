{{- if and .Values.policyExceptions.enableAwsEbsCsiDriverPolex .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.cel.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: kyverno-app-aws-ebs-csi-driver-policy-exception
  namespace: giantswarm
  labels:
    {{- include "kyverno-stack.labels" . | nindent 4 }}
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-non-root-user
    kind: ValidatingPolicy
  - name: disallow-privileged-containers
    kind: ValidatingPolicy
  matchConditions:
  - name: aws-ebs-csi-driver-workloads
    expression: >-
      request.kind.kind in ['DaemonSet', 'Deployment', 'ReplicaSet', 'Pod'] &&
      request.namespace == 'kube-system' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('ebs-csi')
{{- end }}
