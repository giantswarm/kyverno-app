{{- if and .Values.policyExceptions.enableCiliumPolex .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.cel.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: kyverno-app-cilium-envoy-policy-exception
  namespace: giantswarm
  labels:
    {{- include "kyverno-stack.labels" . | nindent 4 }}
spec:
  policyRefs:
  - name: disallow-capabilities
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: disallow-host-ports
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: disallow-selinux
    kind: ValidatingPolicy
  - name: require-emptydir-requests-and-limits
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  # restrict-apparmor-profiles is missing from the legacy exception. It is
  # excepted because the cilium-envoy DaemonSet and Pods fail it.
  - name: restrict-apparmor-profiles
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the cilium-envoy DaemonSet and Pods fail
  # it when the policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the cilium-envoy DaemonSet and Pods fail it when the policy
  # is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the cilium-envoy ServiceAccount fails it
  # when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: cilium-envoy-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['DaemonSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == 'kube-system' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('cilium-envoy')
{{- end -}}
